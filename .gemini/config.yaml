# Gemini Code Assist Configuration
# https://cloud.google.com/gemini/docs/code-assist

# Enable Gemini Code Assist for this repository
enabled: true

# Code review settings
code_review:
  enabled: true
  # Auto-review PRs
  auto_review: true
  # Focus areas for review
  focus:
    - security
    - performance
    - best_practices
    - accessibility
  # Ignore patterns
  ignore:
    - "*.lock"
    - "*.generated.*"
    - "node_modules/**"
    - ".next/**"

# Suggestions settings
suggestions:
  enabled: true
  # Languages to provide suggestions for
  languages:
    - typescript
    - javascript
    - css
  # Style preferences
  style:
    use_arrow_functions: true
    prefer_const: true
    use_template_literals: true

# Documentation assistance
documentation:
  enabled: true
  # Auto-generate JSDoc comments
  auto_jsdoc: true

# Chat assistance
chat:
  enabled: true
  # Allow asking about codebase
  codebase_context: true
