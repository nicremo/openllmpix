name: Claude Issue Assistant

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  triage-issue:
    name: Triage New Issue
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && github.event.action == 'opened'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Analyze and Label Issue
        uses: actions/github-script@v8
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title.toLowerCase();
            const body = (issue.body || '').toLowerCase();
            const labels = [];

            // Auto-label based on content
            if (title.includes('bug') || body.includes('error') || body.includes('not working') || body.includes('broken')) {
              labels.push('bug');
            }
            if (title.includes('feature') || title.includes('request') || body.includes('would be nice') || body.includes('suggestion')) {
              labels.push('enhancement');
            }
            if (title.includes('docs') || title.includes('documentation') || body.includes('readme')) {
              labels.push('documentation');
            }
            if (body.includes('chat studio')) {
              labels.push('chat-studio');
            }
            if (body.includes('gallery')) {
              labels.push('gallery');
            }
            if (body.includes('api') || body.includes('openrouter')) {
              labels.push('api');
            }

            // Add labels if any were detected
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labels
              });
            }

            // Welcome message for new contributors
            const isFirstIssue = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              creator: issue.user.login,
              state: 'all'
            });

            if (isFirstIssue.data.length === 1) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Welcome @${issue.user.login}! Thanks for opening your first issue on OpenLLMPix. A maintainer will review this soon.`
              });
            }

  help-wanted:
    name: Respond to Help Requests
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'issue_comment' &&
      github.event.comment.user.login != 'github-actions[bot]' &&
      contains(github.event.comment.body, '@claude')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Claude Assistant Response
        uses: actions/github-script@v8
        with:
          script: |
            const comment = context.payload.comment.body;
            const issue = context.payload.issue;

            // Basic response - in production you'd call Claude API here
            let response = `Thanks for reaching out! Here are some resources that might help:\n\n`;

            if (comment.toLowerCase().includes('setup') || comment.toLowerCase().includes('install')) {
              response += `**Setup Guide:**\n1. Clone the repo\n2. Run \`npm install\`\n3. Copy \`.env.example\` to \`.env.local\`\n4. Add your API key\n5. Run \`npm run dev\`\n\n`;
            }

            if (comment.toLowerCase().includes('api') || comment.toLowerCase().includes('key')) {
              response += `**API Keys:**\nYou need an API key from one of our supported providers (OpenRouter, Google AI, etc.). Check the Settings modal in the app.\n\n`;
            }

            response += `A maintainer will provide more specific help soon!`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: response
            });
