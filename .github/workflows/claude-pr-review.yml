name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.ts
            **/*.tsx
            **/*.js
            **/*.jsx
            **/*.css

      - name: Claude Code Review
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: anthropics/anthropic-quickstarts@main
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-sonnet-4-20250514
          prompt: |
            You are reviewing a pull request for OpenLLMPix, an open-source AI image generation app.

            Review the following code changes and provide:
            1. A brief summary of the changes
            2. Potential issues or bugs
            3. Security concerns (especially around API keys, user input)
            4. Performance suggestions
            5. Code quality improvements

            Be constructive and helpful. Focus on important issues, not style nitpicks.

            Changed files: ${{ steps.changed-files.outputs.all_changed_files }}
        continue-on-error: true

      - name: Post Review Comment
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Create a helpful comment even if Claude review failed
            const body = `## AI Code Review

            This PR has been flagged for review. A maintainer will review your changes soon.

            **Checklist for reviewers:**
            - [ ] Code follows project conventions
            - [ ] No sensitive data exposed
            - [ ] Build passes locally
            - [ ] Changes are documented if needed

            Thanks for contributing to OpenLLMPix!`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
