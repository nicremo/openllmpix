name: PR Review Helper

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review-helper:
    name: PR Review Helper
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **/*.ts
            **/*.tsx
            **/*.js
            **/*.jsx
            **/*.css

      - name: Post Review Checklist
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const changedFiles = '${{ steps.changed-files.outputs.all_changed_files }}'.split(' ').filter(f => f);

            let fileList = '';
            if (changedFiles.length > 0 && changedFiles.length <= 10) {
              fileList = '\n\n**Changed files:**\n' + changedFiles.map(f => `- \`${f}\``).join('\n');
            } else if (changedFiles.length > 10) {
              fileList = `\n\n**${changedFiles.length} files changed**`;
            }

            const body = `## PR Review Checklist

            Thanks for your contribution to OpenLLMPix!

            **Please verify before merge:**
            - [ ] Code follows project conventions
            - [ ] No sensitive data exposed (API keys, secrets)
            - [ ] \`npm run build\` passes locally
            - [ ] Changes are tested manually
            - [ ] Documentation updated if needed${fileList}

            A maintainer will review your changes soon.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
